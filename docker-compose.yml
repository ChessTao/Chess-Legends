name: chess-legends

services:
  app:
    build: .
    ports:
      - "4173:4173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      DATABASE_URL: postgres://chess_legends:chess_legends_password@postgres:5432/chess_legends
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chess_legends
      POSTGRES_USER: chess_legends
      POSTGRES_PASSWORD: chess_legends_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
